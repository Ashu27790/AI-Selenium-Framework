#################################################
# Application
#################################################

application.name=AI Selenium Framework
application.version=1.0.0

#################################################
# Environment
#################################################

environment=QA
execution.mode=LOCAL

#################################################
# Browser Configuration
#################################################

browser=chrome
headless=false
incognito=false
maximize=true

#################################################
# Application URL
#################################################

base.url=https://www.google.com

#################################################
# Timeouts
#################################################

implicit.wait=10
explicit.wait=30
page.load.timeout=60
script.timeout=30

#################################################
# Screenshot Configuration
#################################################

screenshot.directory=test-output/screenshots
capture.screenshot.on.pass=false
capture.screenshot.on.fail=true

#################################################
# Retry Configuration
#################################################

retry.count=2

#################################################
# Reporting Configuration
#################################################

report.directory=test-output/reports
report.name=Automation Execution Report
report.title=AI Selenium Automation Report
report.theme=STANDARD
report.encoding=UTF-8
report.timestamp.format=yyyyMMdd_HHmmss
report.tester=Ashutosh Kumar Sahu

#################################################
# API Configuration
#################################################

api.base.url=https://test.api.com
api.timeout=60

#################################################
# Database Configuration
#################################################

db.url=
db.username=
db.password=

###########################################################
# AI Configuration
###########################################################

# Enable / Disable AI Features
ai.enabled=true

# AI Provider
ai.provider=OPENAI

# OpenAI Model
ai.model=gpt-5-nano

# OpenAI API Key
ai.api.key=YOUR_OPENAI_API_KEY
# OpenAI Endpoint
ai.base.url=https://api.openai.com/v1

# AI Request Configuration
ai.temperature=0.1
ai.max.tokens=150
ai.timeout=30